<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Writing | Himanshu Kumar Jha</title>
  <meta name="description" content="Field notes on backend, inference platforms, container pipelines and computer vision.">
  <meta name="theme-color" content="#f2f2f3">
  <link rel="icon" href="logo-color.svg">
  <link rel="stylesheet" href="assets/blueprint.css">
</head>

<body>
  <div class="sheet">

    <aside class="rail">
      <a class="rail-name" href="index.html">Himanshu<br>Kumar Jha</a>

      <div class="blueprint rail-spec">
        <div class="rail-spec-label">Specification</div>
        <div class="rail-spec-row">Filed under<br><strong id="filed-under"></strong></div>
        <div class="rail-spec-row is-num">Read time<br><strong id="read-time"></strong></div>
        <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
      </div>

      <div class="rail-group">
        <div class="rail-spec-label">All writing</div>
        <div class="rail-index" id="note-index"></div>
      </div>

      <a href="index.html#writing" class="btn btn-secondary rail-foot">← Back to portfolio</a>
    </aside>

    <main class="note-main">
      <noscript>
        <p class="noscript-note">These notes are drawn from <code>assets/portfolio-data.js</code> in the browser.
          Enable JavaScript, or read the summaries on the <a href="index.html#writing">portfolio sheet</a>.</p>
      </noscript>

      <article>
        <div class="note-meta">
          <span id="note-label"></span><span>·</span><span id="note-status"></span>
          <span class="meta-mobile" id="read-time-inline"></span>
        </div>
        <h1 class="note-h1" id="note-title"></h1>
        <div class="note-rule"></div>
        <p class="note-lede" id="note-lede"></p>
        <div class="note-tags" id="note-tags"></div>

        <div class="note-body">
          <div id="note-paragraphs"></div>
          <div class="note-actions">
            <a class="btn btn-primary blueprint" id="note-next" href="index.html#writing"><span
                id="note-next-label"></span><i class="corner tl"></i><i class="corner tr"></i><i
                class="corner bl"></i><i class="corner br"></i></a>
            <a class="btn btn-secondary" id="note-reply" href="#">Reply by email</a>
          </div>
        </div>
      </article>

      <footer class="sheet-foot">
        <span id="foot-credit"></span>
        <nav><a href="index.html">Back to portfolio</a></nav>
      </footer>
    </main>
  </div>

  <script src="assets/portfolio-data.js"></script>
  <script src="assets/dom.js"></script>
  <script src="assets/blog.js"></script>
</body>

</html>
