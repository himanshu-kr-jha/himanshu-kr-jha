<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Writing | Himanshu Kumar Jha</title>
  <meta name="description" content="Field notes on backend, inference platforms, container pipelines and computer vision.">
  <meta name="theme-color" content="#F3F0E8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121412" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="logo-color.svg">
  <link rel="preload" href="assets/fonts/instrument-serif-400-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/ibm-plex-sans-400-latin.woff2" as="font" type="font/woff2" crossorigin>
  <script src="assets/theme.js"></script>
  <link rel="stylesheet" href="assets/site.css">
</head>

<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="topbar">
    <div class="wrap topbar-inner subbar-inner">
      <a class="back" href="index.html#writing">← All field notes</a>
      <a class="brand-name" href="index.html" id="brand-name">Himanshu Kumar Jha</a>
      <button type="button" class="theme-btn" data-theme-toggle aria-label="Switch colour theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
          aria-hidden="true">
          <path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"></path>
        </svg><span data-theme-label>Dark</span>
      </button>
    </div>
  </header>

  <main id="main" class="wrap note page-end">
    <noscript>
      <p class="noscript-note">These notes are drawn from <code>assets/portfolio-data.js</code> in the browser.
        Enable JavaScript, or read the summaries on the <a href="index.html#writing">portfolio</a>.</p>
    </noscript>

    <article class="note-article">
      <div class="note-meta"><span id="note-code"></span><span id="note-tags"></span></div>
      <h1 class="note-title" id="note-title"></h1>
      <p class="note-lede" id="note-lede"></p>
      <div class="byline"><span id="note-by"></span><span id="note-read"></span></div>
      <div class="note-body" id="note-paragraphs"></div>
    </article>

    <section class="note-end">
      <div class="reply">
        <div class="reply-copy">
          <span>Thoughts on this, or a similar problem of your own?</span>
          <span class="mail-fallback" id="note-reply-note"></span>
        </div>
        <a class="btn btn-accent btn-sm" id="note-reply" href="#">Reply by email</a>
      </div>
      <nav class="more-notes" id="note-index" aria-label="More notes"></nav>
    </section>
  </main>

  <footer class="foot">
    <div class="wrap foot-inner">
      <span id="foot-credit"></span>
      <a href="index.html">Portfolio</a>
    </div>
  </footer>

  <script src="assets/portfolio-data.js"></script>
  <script src="assets/dom.js"></script>
  <script src="assets/blog.js"></script>
</body>

</html>
