# Reference config for the optional assistant backend. Nothing here is live
# until you deploy it. See README.md in this directory.

name = "portfolio-ask"
main = "ask.js"
compatibility_date = "2026-01-01"

# Per-IP friction. Best-effort and per-datacentre, not a global counter, and
# IPv6 rotation defeats it — treat it as a speed bump. The daily cap in ask.js
# and the spend limit in your provider console are the real ceilings.
[[unsafe.bindings]]
name = "ASK_RATE_BURST"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Holds the daily call counter and the ASSISTANT_ENABLED kill switch.
# Create with: wrangler kv namespace create ASK_KV
# [[kv_namespaces]]
# binding = "ASK_KV"
# id = "<paste the id wrangler prints>"

# The API key is a secret, never a var:
#   wrangler secret put ANTHROPIC_API_KEY
